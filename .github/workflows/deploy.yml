name: Deploy web platform

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: budgetguard-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'Kaleva-Media/budget-gaurd' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://budget.cloudcomms.co.za
    timeout-minutes: 20
    steps:
      - name: Select current main SHA and its successful CI artifact
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$EVENT" = workflow_run ]; then test "$RUN_SHA" = "$sha"; fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=10")
          run_id=$(jq -er '.workflow_runs[0] | select(.conclusion=="success" and .head_branch=="main") | .id' <<< "$runs")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs[] | select(.name=="all-tests") | .conclusion' | grep -qx success
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-deploy-${{ steps.revision.outputs.sha }}
          run-id: ${{ steps.revision.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Configure restricted SSH identity and pinned host key
        env:
          DEPLOY_KEY: ${{ secrets.BUDGETGUARD_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BUDGETGUARD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/budgetguard
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/budgetguard ~/.ssh/known_hosts
      - name: Private ports, backup/restore-test, migrate, deploy and smoke-test
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          DEPLOY_HOST: ${{ vars.BUDGETGUARD_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          ssh -i ~/.ssh/budgetguard -o BatchMode=yes -o StrictHostKeyChecking=yes "budgetguard-deploy@$DEPLOY_HOST" "deploy $REVISION" < web-deploy.tar.gz
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/budgetguard
